name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Private repo: cancel superseded runs for the same branch / PR to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      # midir links libasound (ALSA). winit/glutin/xkbcommon load X11/Wayland/GL
      # via dlopen and rfd uses the xdg-portal backend, so no GTK/X11/GL dev
      # packages are needed to build or test.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      # The action has no release tags; pinned to its `master` commit of 24 Nov 2026.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (v2.9.3)
        with:
          # Pushes save the cache; pull requests only restore (avoids duplicate caches).
          save-if: ${{ github.event_name == 'push' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release (virus-app)
        run: cargo build -p virus-app --release --locked

      # The `virus` CLI is the tool used in live sessions with the synth.
      - name: Build release (virus-cli)
        run: cargo build -p virus-cli --release --locked

      - name: Upload virus-app.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: virus-app-windows-x64
          path: target/release/virus-app.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload virus.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: virus-cli-windows-x64
          path: target/release/virus.exe
          if-no-files-found: error
          retention-days: 14
