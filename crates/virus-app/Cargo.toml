[package]
name = "virus-app"
version.workspace = true
edition.workspace = true
description = "Native desktop editor, patch librarian, and real-time SysEx controller for Access Virus"
authors.workspace = true
license.workspace = true

[dependencies]
virus-syx = { path = "../virus-syx" }
virus-midi = { path = "../virus-midi" }
virus-db = { path = "../virus-db" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui = "0.27"
# Same wgpu as eframe 0.27; enables the DX12 backend (eframe disables wgpu's default features), which
# provides the WARP software rasteriser used by the wgpu fallback on machines without a GPU.
wgpu = { version = "0.19", default-features = false, features = ["dx12"] }
rfd = "0.14"
directories = "6.0.0"

[dev-dependencies]
