[package]
name = "virus-app"
version.workspace = true
edition.workspace = true
description = "Native desktop editor, patch librarian, and real-time SysEx controller for Access Virus"
authors.workspace = true
license.workspace = true

[dependencies]
virus-syx = { path = "../virus-syx" }
virus-midi = { path = "../virus-midi" }
virus-db = { path = "../virus-db" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
rfd = "0.14"
directories = "6.0.0"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
